name: lancast_viewer
description: LanCast Viewer — room admin, approval, and multi-screen display.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_webrtc: ^0.14.1
  go_router: ^16.0.0
  logger: ^2.5.0
  lancast_core: ^0.1.0
  lancast_discovery: ^0.1.0
  lancast_signaling: ^0.1.0
  lancast_webrtc: ^0.1.0
  lancast_arena: ^0.1.0
  google_fonts: ^6.2.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
